name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Fixtures behave as documented
        shell: bash
        run: |
          node dist/cli/index.js check -C fixtures/laravel-valid
          node dist/cli/index.js check -C fixtures/nestjs-valid
          ! node dist/cli/index.js check -C fixtures/laravel-violations
          ! node dist/cli/index.js check -C fixtures/nestjs-violations
