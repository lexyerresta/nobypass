name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    # The test runner (vitest 5) needs Node 22+; the CLI itself supports Node 20 (see the node20 job).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Landing page demo data matches the fixtures
        shell: bash
        run: node scripts/build-site-demo.mjs && git diff --exit-code site/demo-data.js
      - name: Fixtures behave as documented
        shell: bash
        run: |
          for s in laravel nestjs symfony express nextjs django fastapi spring; do
            node dist/cli/index.js check -C fixtures/$s-valid
            ! node dist/cli/index.js check -C fixtures/$s-violations
          done

  node20:
    # Smoke test: the published CLI runs on the oldest supported Node version.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: CLI on every fixture
        shell: bash
        run: |
          for s in laravel nestjs symfony express nextjs django fastapi spring; do
            node dist/cli/index.js check -C fixtures/$s-valid
            ! node dist/cli/index.js check -C fixtures/$s-violations
          done
