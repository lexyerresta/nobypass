# NoBypass preset: Laravel service-repository architecture.
#
# Controller -> Service -> Repository -> Model is the widely used Laravel layering built on two
# public patterns: Service Layer and Repository (Martin Fowler, Patterns of Enterprise Application
# Architecture, 2002). Repository interfaces are bound to Eloquent implementations in a service
# provider, as described in the Laravel docs ("Binding Interfaces To Implementations").
#
# Laravel facades are understood: a call through a custom facade (getFacadeAccessor) or a real-time
# facade (Facades\App\...) counts as a dependency on the class behind it.
#
# Discovery starts from this preset, drops layers that have no files in your repository,
# and re-wires the chain around them. Review every line before approving.
schema: 1
projects:
  - id: api
    root: .
    language: php
    framework: laravel
    include:
      - app/**/*.php
    layers:
      controller: ["app/Http/Controllers/**/*.php"]
      service: ["app/Services/**/*.php"]
      # Interfaces (Contracts/ or Interfaces/) and Eloquent implementations both live here.
      repository: ["app/Repositories/**/*.php"]
      model: ["app/Models/**/*.php"]
      # Framework glue, facades, helpers and data types that any layer may use.
      shared:
        - "app/Facades/**/*.php"
        - "app/Helpers/**/*.php"
        - "app/Support/**/*.php"
        - "app/Http/Requests/**/*.php"
        - "app/Http/Resources/**/*.php"
        - "app/Http/Middleware/**/*.php"
        - "app/Http/Kernel.php"
        - "app/Providers/**/*.php"
        - "app/Console/**/*.php"
        - "app/Exceptions/**/*.php"
        - "app/Jobs/**/*.php"
        - "app/Events/**/*.php"
        - "app/Listeners/**/*.php"
        - "app/Mail/**/*.php"
        - "app/Notifications/**/*.php"
        - "app/Policies/**/*.php"
        - "app/Enums/**/*.php"
        - "app/DTOs/**/*.php"
        - "app/Data/**/*.php"
        - "app/Rules/**/*.php"
        - "app/Casts/**/*.php"
        - "app/View/**/*.php"
        - "app/Observers/**/*.php"
        - "app/Contracts/**/*.php"
        - "app/Traits/**/*.php"
    dependencies:
      allowed_direct:
        controller: [service]
        service: [repository]
        repository: [model]
        model: []
        shared: ["*"]
      shared: [shared]
      type_only: enforce
      same_layer: allow
      detect_cycles: true
    rules:
      direct_orm_access:
        enabled: true
        deny_in: [controller, service]
        allow_in: [repository]
        severity: error
      catch_policy:
        enabled: true
        discourage_in: [service, repository]
        severity: warning
      unclassified: warning
    exclude:
      - vendor/**
      - tests/**
      - database/migrations/**
      - database/seeders/**
      - database/factories/**
    exceptions: []
    baseline: .nobypass/baseline.json
